<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Signal Tester</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    body {
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0d0d0d, #1a1a2e);
      color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 2rem;
      width: 320px;
      box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
    }
    h1 {margin-top:0;font-size:1.5rem;font-weight:600;text-align:center;}
    input[type='text'] {
      width:100%;padding:0.6rem;margin-top:1rem;border:none;border-radius:6px;background:rgba(255,255,255,0.12);color:#fff;
    }
    button {
      width:100%;padding:0.7rem;margin-top:1rem;border:none;border-radius:6px;background:#4e9aff;color:#fff;font-weight:600;cursor:pointer;transition:background 0.3s ease;
    }
    button:hover {background:#3578e5;}
    .result {margin-top:1rem;padding:0.8rem;background:rgba(255,255,255,0.12);border-radius:6px;word-break:break-word;}
  </style>
</head>
<body>
  <div class="card">
    <h1>Signal Tester</h1>
    <input type="text" id="ticker" placeholder="Enter ticker (e.g., RELIANCE.NS)" />
    <button id="fetchBtn">Get Signal</button>
    <div id="output" class="result" style="display:none;"></div>
  </div>
  <script>
    const btn=document.getElementById('fetchBtn');
    const output=document.getElementById('output');
    btn.addEventListener('click', async()=>{
      const ticker=document.getElementById('ticker').value.trim();
      if(!ticker){output.style.display='block';output.textContent='Please enter a ticker.';return;}
      output.style.display='block';output.textContent='Fetching...';
      try{
        const resp=await fetch('/v1/signal',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ticker})});
        if(!resp.ok){const err=await resp.json();throw new Error(err.detail||resp.statusText);}
        const data=await resp.json();
        output.innerHTML=`<strong>${data.ticker}</strong> – ${data.signal}<br/>Confidence: ${data.confidence}<br/>Regime: ${data.regime}<br/>Price: ${data.price}<br/>SMA200: ${data.sma_200}<br/>Timestamp: ${new Date(data.timestamp).toLocaleString()}`;
      }catch(e){output.textContent='Error: '+e.message;}
    });
  </script>
</body>
</html>
