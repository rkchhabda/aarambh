services:
  api:
    build:
      context: .
      dockerfile: service/Dockerfile
    container_name: quant-signal-api
    ports:
      - "8000:8000"
    environment:
      - API_URL=http://api:8000
      - API_KEY=qs_hvw4wTe3mRaRruyVXxmT1fcgWRiZKXG-1aMbeOO9
    volumes:
      - ./service:/app/service
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./phase5_artifacts:/app/phase5_artifacts
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  dashboard:
    build:
      context: .
      dockerfile: service/Dockerfile
    container_name: quant-signal-dashboard
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - API_KEY=qs_hvw4wTe3mRaRruyVXxmT1fcgWRiZKXG-1aMbeOO9
    volumes:
      - ./service:/app/service
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./phase5_artifacts:/app/phase5_artifacts
    command: >
      streamlit run service/dashboard.py
      --server.port=8501
      --server.address=0.0.0.0
      --server.headless=true
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

networks:
  default:
    name: quant-signal-net