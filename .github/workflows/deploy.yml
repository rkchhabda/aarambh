name: Auto Deploy to Render

on:
  push:
    branches:
      - main

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest httpx

      - name: Run Unit & Integration Tests
        run: |
          python test_features.py
          python test_phase_a.py

      - name: Trigger Render Deploy Hook (API)
        if: env.RENDER_API_DEPLOY_HOOK != ''
        run: |
          curl -X POST "$RENDER_API_DEPLOY_HOOK"
        env:
          RENDER_API_DEPLOY_HOOK: ${{ secrets.RENDER_API_DEPLOY_HOOK }}

      - name: Trigger Render Deploy Hook (Dashboard)
        if: env.RENDER_DASHBOARD_DEPLOY_HOOK != ''
        run: |
          curl -X POST "$RENDER_DASHBOARD_DEPLOY_HOOK"
        env:
          RENDER_DASHBOARD_DEPLOY_HOOK: ${{ secrets.RENDER_DASHBOARD_DEPLOY_HOOK }}
