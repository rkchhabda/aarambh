name: Daily Market Cache & Indices Refresh

on:
  schedule:
    # 13:00 UTC = 18:30 IST (Monday through Friday, after NSE market close)
    - cron: '0 13 * * 1-5'
  workflow_dispatch: # Allows manual trigger from GitHub UI / CLI

permissions:
  contents: write

jobs:
  refresh-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 55   # Extended from 45 to allow grading step

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-render.txt

      - name: Run Cache & Indices Rebuild
        run: |
          python rebuild_cache_v2.py

      - name: Validate Generated Cache Files
        run: |
          python -c '
          import json, os, sys
          cache_file = "service/models/ticker_cache.json"
          indices_file = "service/models/indices_cache.json"
          if not os.path.exists(cache_file):
              sys.exit("ERROR: ticker_cache.json was not created.")
          with open(cache_file) as f:
              data = json.load(f)
          count = len(data)
          print(f"[VALIDATION] Found {count} tickers in cache.")
          if count < 100:
              sys.exit(f"ERROR: Only {count} tickers found. Expected >= 100. Aborting commit.")
          if not os.path.exists(indices_file):
              sys.exit("ERROR: indices_cache.json was not created.")
          with open(indices_file) as f:
              idx = json.load(f)
          if not idx.get("nifty50") or not idx.get("bse100"):
              sys.exit("ERROR: indices_cache.json missing required index objects.")
          print("[VALIDATION] Cache validation passed successfully.")
          '

      # ── Regime Forward-Test Grader ─────────────────────────────────────────
      # Runs AFTER the cache rebuild so today's EOD closes are available.
      # Fills yesterday's outcomes (ret_1d, was_protected) using today's
      # settled close, then logs today's regime state for all 138 tickers.
      # No lookahead: all data used is already-closed point-in-time.
      - name: Run Regime Forward-Test Grader
        run: |
          python scripts/grade_regime_forward.py

      - name: Validate Grader Output
        run: |
          python -c '
          import json, os, sys
          summary_file = "service/models/regime_forward_summary.json"
          csv_file = "service/models/regime_forward_log.csv"
          if not os.path.exists(summary_file):
              # First run before tracker start is allowed — script exits cleanly
              print("[INFO] regime_forward_summary.json not yet written (pre-start date). OK.")
              sys.exit(0)
          with open(summary_file) as f:
              s = json.load(f)
          n = s.get("sample_n", 0)
          print(f"[VALIDATION] Grader: sample_n={n}, tracker_start={s.get(\"tracker_start\")}")
          if not os.path.exists(csv_file):
              print("[WARN] regime_forward_log.csv not written (may be empty log). Continuing.")
          else:
              with open(csv_file) as f:
                  lines = f.readlines()
              print(f"[VALIDATION] CSV: {len(lines)-1} data rows (excluding header).")
          '

      - name: Commit and Push Updated Cache & Tracker Files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): automated daily EOD cache + regime forward-test log [skip ci]"
          file_pattern: >-
            service/models/ticker_cache.json
            service/models/indices_cache.json
            service/models/regime_forward_summary.json
            service/models/regime_forward_log.csv
            service/aarambh.db
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

